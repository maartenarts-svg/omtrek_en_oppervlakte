<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leerplatform Wiskunde - Login</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1>📐 Wiskunde Leerplatform</h1>
                <p class="subtitle">Omtrek & Oppervlakte</p>
            </div>

            <!-- Leerlingen -->
            <form id="loginForm" class="login-form" onsubmit="handleEmailLogin(event)">
                <div class="form-group">
                    <label for="email">Schoolmailadres</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="voornaam.achternaam@labsintniklaas.be"
                        required
                        autocomplete="email">
                </div>
                <button type="submit" id="emailLoginBtn" class="btn btn-primary btn-large">
                    Inloggen
                </button>
            </form>

            <p id="loginError" class="login-error hidden"></p>

            <!-- Scheiding -->
            <div class="login-divider">
                <span>Leerkracht?</span>
            </div>

            <!-- Leerkrachten -->
            <button id="googleLoginBtn" class="btn btn-google" onclick="loginWithGoogle()">
                <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                    <path fill="none" d="M0 0h48v48H0z"/>
                </svg>
                Inloggen met Google
            </button>

            <div class="login-footer">
                <p class="help-text">Problemen met inloggen? Vraag hulp aan je leerkracht.</p>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

    <!-- App Scripts -->
    <script src="./js/firebase-config.js"></script>
    <script src="./js/auth.js"></script>

    <script>
        function handleEmailLogin(e) {
            e.preventDefault();
            loginWithEmail(document.getElementById('email').value);
        }

        // Al ingelogd? Meteen doorsturen.
        const currentUser = getCurrentUser();
        if (currentUser) {
            window.location.href = currentUser.isAdmin
                ? 'pages/dashboard.html'
                : 'pages/overview.html';
        }
    </script>
</body>
</html>
