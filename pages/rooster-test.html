<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <title>Rooster test – 5-1</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; background: #f5f5f5; }
    h2 { color: #555; margin-top: 32px; }
    .rij { display: flex; flex-wrap: wrap; gap: 24px; margin-top: 16px; }
    .kaart { background: white; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.12); }
    .kaart h3 { margin: 0 0 8px; font-size: 13px; color: #888; }
    button { margin-top: 24px; padding: 10px 24px; font-size: 15px; cursor: pointer; border: none; background: #4a7a10; color: white; border-radius: 6px; }
    button:hover { background: #3a6008; }
  </style>
</head>
<body>
  <h1>Rooster-tekeningen – 5-1 test</h1>
  <button onclick="teken()">Nieuwe figuren genereren</button>
  <h2>Vraagstelling (grijs)</h2>
  <div class="rij">
    <div class="kaart"><h3>Rechthoek 1</h3><div id="r1"></div></div>
    <div class="kaart"><h3>Rechthoek 2</h3><div id="r2"></div></div>
    <div class="kaart"><h3>Vierkant 1</h3><div id="v1"></div></div>
    <div class="kaart"><h3>Vierkant 2</h3><div id="v2"></div></div>
  </div>
  <h2>Feedback (blauw + nummers)</h2>
  <div class="rij">
    <div class="kaart"><h3>Rechthoek 1</h3><div id="r1f"></div></div>
    <div class="kaart"><h3>Rechthoek 2</h3><div id="r2f"></div></div>
    <div class="kaart"><h3>Vierkant 1</h3><div id="v1f"></div></div>
    <div class="kaart"><h3>Vierkant 2</h3><div id="v2f"></div></div>
  </div>

  <script>
    const GRID = 10;
    const CEL  = 40;

    function r(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); }

    function maakRechthoek() {
      let w, h;
      do { w = r(2, 8); h = r(2, 8); } while (w === h);
      const x = r(1, 9 - w);
      const y = r(1, 9 - h);
      return { x, y, w, h };
    }

    function maakVierkant() {
      const z = r(2, 8);
      const x = r(1, 9 - z);
      const y = r(1, 9 - z);
      return { x, y, w: z, h: z };
    }

    function rasterlijnen() {
      const size = (GRID + 1) * CEL;
      let s = '';
      for (let i = 0; i <= GRID; i++) {
        const p = i * CEL;
        s += `<line x1="${p}" y1="0" x2="${p}" y2="${size}" stroke="#ddd" stroke-width="1"/>`;
        s += `<line x1="0" y1="${p}" x2="${size}" y2="${p}" stroke="#ddd" stroke-width="1"/>`;
      }
      return s;
    }

    function eenheidIndicator(size, unitY) {
      return `
        <line x1="${CEL}" y1="${unitY}" x2="${CEL*2}" y2="${unitY}" stroke="#333" stroke-width="2"/>
        <line x1="${CEL}" y1="${unitY-5}" x2="${CEL}" y2="${unitY+5}" stroke="#333" stroke-width="2"/>
        <line x1="${CEL*2}" y1="${unitY-5}" x2="${CEL*2}" y2="${unitY+5}" stroke="#333" stroke-width="2"/>
        <text x="${CEL*1.5}" y="${unitY+18}" text-anchor="middle" font-size="12" fill="#333">1 eenheid</text>`;
    }

    function tekenVraag(containerId, fig) {
      const size = (GRID + 1) * CEL;
      const unitY = GRID * CEL + 15;
      const fx = fig.x * CEL, fy = fig.y * CEL;
      const fw = fig.w * CEL, fh = fig.h * CEL;

      let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
      svg += rasterlijnen();
      svg += `<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}"
                fill="rgba(224,224,224,0.6)" stroke="#333" stroke-width="2"/>`;
      svg += eenheidIndicator(size, unitY);
      svg += `</svg>`;
      document.getElementById(containerId).innerHTML = svg;
    }

    function tekenFeedback(containerId, fig) {
      const size = (GRID + 1) * CEL;
      const unitY = GRID * CEL + 15;
      const fx = fig.x * CEL, fy = fig.y * CEL;
      const fw = fig.w * CEL, fh = fig.h * CEL;
      const area = fig.w * fig.h;
      const off = 18; // offset buiten de figuur

      // Middelpunten van de zijden (in pixels)
      const midBoven  = { x: fx + fw / 2, y: fy };
      const midOnder  = { x: fx + fw / 2, y: fy + fh };
      const midLinks  = { x: fx,           y: fy + fh / 2 };
      const midRechts = { x: fx + fw,      y: fy + fh / 2 };

      // Middelpunt van de figuur
      const cx = fx + fw / 2;
      const cy = fy + fh / 2;

      let svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">`;
      svg += rasterlijnen();
      svg += `<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}"
                fill="rgba(168,216,229,0.6)" stroke="#6B9BD1" stroke-width="3"/>`;

      // Zijdelengtes buiten de figuur
      const lbl = (x, y, t) =>
        `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle"
               font-size="15" font-weight="700" fill="#1a5276">${t}</text>`;
      svg += lbl(midBoven.x,       midBoven.y  - off, fig.w);
      svg += lbl(midOnder.x,       midOnder.y  + off, fig.w);
      svg += lbl(midLinks.x  - off, midLinks.y,        fig.h);
      svg += lbl(midRechts.x + off, midRechts.y,       fig.h);

      // Formule in het midden
      svg += lbl(cx, cy - 12, `${fig.w} · ${fig.h}`);
      svg += lbl(cx, cy + 12, `= ${area}`);

      svg += eenheidIndicator(size, unitY);
      svg += `</svg>`;
      document.getElementById(containerId).innerHTML = svg;
    }

    function teken() {
      const figs = [maakRechthoek(), maakRechthoek(), maakVierkant(), maakVierkant()];
      const ids  = ['r1', 'r2', 'v1', 'v2'];
      ids.forEach((id, i) => {
        tekenVraag(id, figs[i]);
        tekenFeedback(id + 'f', figs[i]);
      });
    }

    teken();
  </script>
</body>
</html>
